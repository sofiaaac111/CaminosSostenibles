
services:
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - app-network

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "8082:8082"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - app-network

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    ports:
      - "8085:8085"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - app-network

  purchase-service:
    build:
      context: .
      dockerfile: purchase-service/Dockerfile
    ports:
      - "8086:8086"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/css:/usr/share/nginx/html/css:ro
      - ./frontend/js:/usr/share/nginx/html/js:ro
      - ./frontend/admin.html:/usr/share/nginx/html/admin.html:ro
      - ./frontend/auth.html:/usr/share/nginx/html/auth.html:ro
      - ./frontend/bodega.html:/usr/share/nginx/html/bodega.html:ro
      - ./frontend/carrito.html:/usr/share/nginx/html/carrito.html:ro
      - ./frontend/catalogo.html:/usr/share/nginx/html/catalogo.html:ro
      - ./frontend/checkout.html:/usr/share/nginx/html/checkout.html:ro
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/pedidos.html:/usr/share/nginx/html/pedidos.html:ro
      - ./frontend/perfil.html:/usr/share/nginx/html/perfil.html:ro
      - ./frontend/login-admin.html:/usr/share/nginx/html/login-admin.html:ro
      - ./frontend/factura.html:/usr/share/nginx/html/factura.html:ro
      - ./frontend/fondo1.png:/usr/share/nginx/html/fondo1.png:ro
      - ./frontend/inicioCli.png:/usr/share/nginx/html/inicioCli.png:ro
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
