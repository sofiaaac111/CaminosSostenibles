server.port=8086
server.address=0.0.0.0
spring.application.name=purchase-service

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/bd_pedidos?createDatabaseIfNotExist=true
spring.datasource.username=${BD_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

product-service.url=http://product-service:8081
inventory-service.url=http://inventory-service:8082
