#Abrir Ubuntu y ejecutar ./actualizar-ip.sh
#Si la IP cambió, actualizar las 2 líneas en nginx.conf
#Levantar servicios en Ubuntu: cd CaminosSostenibles && sudo service docker start && docker compose up inventory-service product-service
#Levantar el resto en Windows: docker compose up frontend customer-service purchase-service


server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /api/productos {
        #esta linea
        set $upstream http://192.168.125.240:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/inventario {
        #esta linea
        set $upstream http://192.168.125.240:8082;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/clientes {
        set $upstream http://customer-service:8085;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/pedidos {
        set $upstream http://purchase-service:8086;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}