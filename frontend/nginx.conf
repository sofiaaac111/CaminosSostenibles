server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker para resolver nombres de servicios
    resolver 127.0.0.11 valid=10s;

    # Archivos estáticos
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Proxy hacia cada microservicio
    # La variable hace que nginx resuelva el nombre en cada petición
    # (evita error si el servicio no está listo al arrancar nginx)
    location /api/productos {
        set $upstream http://product-service:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/inventario {
        set $upstream http://inventory-service:8082;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/clientes {
        set $upstream http://customer-service:8085;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/pedidos {
        set $upstream http://purchase-service:8086;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
