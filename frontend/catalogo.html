<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo – Caminos Sostenibles</title>
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    .layout-catalogo {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 90px;
      background: var(--panel);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--sombra);
      border: 1px solid var(--borde);
    }

    .sidebar h3 {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--acento);
      margin: 0 0 12px 0;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--borde);
    }

    .sidebar-seccion {
      margin-bottom: 24px;
    }

    .sidebar-seccion:last-child {
      margin-bottom: 0;
    }

    .btn-categoria {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--texto);
      transition: all 0.2s ease;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .btn-categoria:hover {
      background: var(--fondo);
      transform: translateX(4px);
    }

    .btn-categoria.activo {
      background: var(--acento);
      color: white;
      font-weight: 600;
    }

    .precio-display {
      font-weight: 700;
      color: var(--acento);
      font-size: 1rem;
      margin-top: 8px;
      text-align: center;
      background: rgba(214,40,40,0.1);
      padding: 6px 10px;
      border-radius: 6px;
    }

    .barra-superior {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      background: var(--panel);
      padding: 16px;
      border-radius: 12px;
      box-shadow: var(--sombra);
      border: 1px solid var(--borde);
    }

    .barra-superior input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      background: white;
      transition: border-color 0.2s ease;
    }

    .barra-superior input[type="text"]:focus {
      outline: none;
      border-color: var(--secundario);
      box-shadow: 0 0 0 2px rgba(255,149,5,0.1);
    }

    .conteo-resultados {
      font-size: 0.85rem;
      color: var(--texto-suave);
      white-space: nowrap;
      font-weight: 600;
      background: var(--fondo);
      padding: 6px 10px;
      border-radius: 16px;
      border: 1px solid var(--borde);
    }

    /* Slider de precio mejorado sutilmente */
    #filtro-precio-max {
      width: 100%;
      accent-color: var(--acento);
      cursor: pointer;
    }

    /* Checkbox mejorado */
    #solo-disponibles {
      accent-color: var(--acento);
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    @media (max-width: 768px) {
      .layout-catalogo {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .sidebar {
        position: static;
        order: 2;
      }
      .barra-superior {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
      .conteo-resultados {
        align-self: center;
      }
    }
  </style>
</head>
<body>

<nav class="cabecera">
  <span class="cabecera-marca">Caminos Sostenibles</span>
  <div class="cabecera-nav">
    <!-- Nav cliente -->
    <a href="/catalogo.html" class="activo nav-cliente">Catálogo</a>
    <a href="/carrito.html" class="nav-cliente">
      Carrito <span class="badge-carrito" id="badge-carrito" style="display:none;"></span>
    </a>
    <a href="/pedidos.html" class="nav-cliente">Mis pedidos</a>
    <a href="/perfil.html" class="nav-cliente">Mi perfil</a>
    <button class="nav-cliente" onclick="cerrarSesion()">Salir</button>
    <!-- Nav admin (oculto por defecto, JS lo muestra) -->
    <div id="nav-admin" style="display:none; gap:4px; align-items:center;">
      <a href="/admin.html">Administrador</a>
      <a href="/bodega.html">Bodega</a>
      <button onclick="cerrarSesion()">Salir</button>
    </div>
  </div>
</nav>

<div class="contenedor">
  <div id="notificacion"></div>

  <!-- Banner modo admin (oculto por defecto) -->
  <div id="banner-admin" style="display:none; background:#1a1a2e; color:#fff; border-radius:10px; padding:12px 20px; margin-bottom:16px; display:none; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
    <span style="font-weight:700; font-size:0.95rem;">👁 Vista previa del catálogo — Modo administrador</span>
    <span style="font-size:0.82rem; opacity:0.75;">Los clientes no ven productos sin stock ni cantidades exactas</span>
  </div>

  <!-- Barra de búsqueda superior -->
  <div class="barra-superior">
    <input type="text" id="buscador" placeholder="Buscar producto por nombre..." oninput="filtrarProductos()">
    <span class="conteo-resultados" id="conteo"></span>
  </div>

  <div class="layout-catalogo">

    <!-- Sidebar de filtros -->
    <aside class="tarjeta sidebar">

      <div class="sidebar-seccion">
        <h3>Categorías</h3>
        <button class="btn-categoria activo" onclick="seleccionarCategoria('', this)">Todas</button>
        <div id="lista-categorias"></div>
      </div>

      <div class="sidebar-seccion">
        <h3>Precio máximo</h3>
        <input type="range" id="filtro-precio-max" min="0" max="100000" step="1000"
               value="100000" oninput="actualizarPrecio(this)" style="width:100%; accent-color:var(--acento);">
        <p class="precio-display" id="precio-display">Sin límite</p>
      </div>

      <div class="sidebar-seccion" id="sidebar-disponibilidad">
        <h3>Disponibilidad</h3>
        <label style="display:flex; align-items:center; gap:8px; font-size:0.875rem; cursor:pointer;">
          <input type="checkbox" id="solo-disponibles" onchange="filtrarProductos()"
                 style="accent-color:var(--acento);">
          Solo con stock disponible
        </label>
      </div>

      <button class="boton-secundario" style="width:100%; margin-top:4px;" onclick="limpiarFiltros()">
        Limpiar filtros
      </button>
    </aside>

    <!-- Grilla de productos -->
    <div id="grilla-productos" class="grilla-productos">
      <p class="placeholder">Cargando productos...</p>
    </div>

  </div>
</div>

<script src="/js/api.js?v=2"></script>
<script src="/js/catalogo.js?v=2"></script>
</body>
</html>
