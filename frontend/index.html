<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caminos Sostenibles Market</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--fondo);">

<div style="text-align:center; max-width:480px; padding:32px 20px;">
  <h1 style="font-size:2.2rem; color:var(--acento); margin-bottom:8px;">Caminos Sostenibles</h1>
  <p style="font-size:1.1rem; color:var(--texto-suave); margin-bottom:48px;">Market · Productos naturales y sostenibles</p>

  <div style="display:flex; flex-direction:column; gap:16px; max-width:280px; margin:0 auto;">
    <a href="/auth.html" class="boton-principal" style="text-align:center; padding:14px; font-size:1rem;">
      Ingresar como cliente
    </a>
    <a href="/login-admin.html" class="boton-secundario" style="text-align:center; padding:14px; font-size:1rem;">
      Acceso personal
    </a>
  </div>
</div>

<script src="/js/api.js?v=2"></script>
<script>
  const sesion = obtenerSesion()
  if (sesion) {
    if (sesion.rol === 'ADMIN') window.location.href = '/admin.html'
    else if (sesion.rol === 'BODEGUERO') window.location.href = '/bodega.html'
    else window.location.href = '/catalogo.html'
  }
</script>
</body>
</html>
