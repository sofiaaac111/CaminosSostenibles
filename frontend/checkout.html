<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago - Caminos Sostenibles</title>
  <link rel="stylesheet" href="/css/estilos.css?v=4">
</head>
<body>

<nav class="cabecera">
  <span class="cabecera-marca">Caminos Sostenibles</span>
  <div class="cabecera-nav">
    <a href="/catalogo.html">Catálogo</a>
    <a href="/carrito.html">Carrito</a>
    <a href="/checkout.html" class="activo">Pago</a>
  </div>
</nav>

<div class="contenedor checkout-contenedor">
  <div id="notificacion"></div>

  <div class="checkout-grid">
    <div class="tarjeta">
      <h2>Datos de pago</h2>

      <form class="formulario" id="form-pago" onsubmit="confirmarCompra(event)">
        <label class="ancho-completo">
          Titular de la tarjeta
          <input type="text" id="titular" autocomplete="cc-name" placeholder="Nombre como aparece en la tarjeta" required>
        </label>

        <label class="ancho-completo">
          Número de tarjeta
          <input type="text" id="numero-tarjeta" maxlength="19" inputmode="numeric" autocomplete="cc-number" pattern="([0-9]{16}|[0-9 ]{19})" placeholder="1234 1234 1234 1234" required>
        </label>

        <label>
          Vencimiento (MM/AA)
          <input type="text" id="vencimiento" maxlength="5" inputmode="numeric" autocomplete="cc-exp" placeholder="12/26" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" required>
        </label>

        <label>
          CVV
          <input type="password" id="cvv" maxlength="4" inputmode="numeric" autocomplete="cc-csc" pattern="[0-9]{3,4}" placeholder="123" required>
        </label>

        <label class="ancho-completo">
          Dirección de entrega
          <input type="text" id="direccion-entrega" readonly>
        </label>

        <div class="checkout-acciones ancho-completo">
          <a href="/carrito.html" class="boton-secundario">Volver al carrito</a>
          <button type="submit" class="boton-principal" id="btn-confirmar">Pagar y confirmar</button>
        </div>
      </form>
    </div>

    <aside class="tarjeta checkout-resumen">
      <span class="checkout-paso">Resumen</span>
      <h2>Tu pedido</h2>
      <div id="resumen-pedido" class="resumen-pedido"></div>
      <div class="checkout-total">
        <span>Total</span>
        <strong id="total-pago">$0</strong>
      </div>
    </aside>
  </div>
</div>

<script src="/js/api.js?v=2"></script>
<script src="/js/checkout.js?v=3"></script>
</body>
</html>
