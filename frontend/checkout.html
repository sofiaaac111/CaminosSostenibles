<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago – Caminos Sostenibles</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

<nav class="cabecera">
  <span class="cabecera-marca">Caminos Sostenibles</span>
  <div class="cabecera-nav">
    <a href="/catalogo.html">Catálogo</a>
    <a href="/carrito.html">Carrito</a>
    <a href="/checkout.html" class="activo">Pago</a>
  </div>
</nav>

<div class="contenedor" style="max-width:700px;">
  <div id="notificacion"></div>

  <div style="display:grid; grid-template-columns:1fr 320px; gap:20px;">

    <div class="tarjeta">
      <h2 style="margin-bottom:16px;">Datos de pago</h2>
      <form class="formulario" id="form-pago" onsubmit="confirmarCompra(event)">
        <label class="ancho-completo">
          Titular de la tarjeta
          <input type="text" id="titular" required>
        </label>
        <label class="ancho-completo">
          Número de tarjeta
          <input type="text" id="numero-tarjeta" maxlength="16" inputmode="numeric" pattern="[0-9]{16}" placeholder="1234123412341234" required>
        </label>
        <label>
          Vencimiento (MM/AA)
          <input type="text" id="vencimiento" placeholder="12/26" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" required>
        </label>
        <label>
          CVV
          <input type="text" id="cvv" maxlength="4" inputmode="numeric" pattern="[0-9]{3,4}" required>
        </label>
        <label class="ancho-completo">
          Dirección de entrega
          <input type="text" id="direccion-entrega" readonly style="opacity:0.7;">
        </label>
        <div class="ancho-completo">
          <button type="submit" class="boton-principal" id="btn-confirmar">Pagar y confirmar</button>
        </div>
      </form>
    </div>

    <div class="tarjeta" style="height:fit-content;">
      <h3 style="margin-bottom:12px;">Resumen</h3>
      <div id="resumen-pedido"></div>
      <hr style="border:none; border-top:1px solid var(--borde); margin:12px 0;">
      <strong>Total: <span id="total-pago">$0</span></strong>
    </div>

  </div>
</div>

<script src="/js/api.js?v=2"></script>
<script src="/js/checkout.js?v=2"></script>
</body>
</html>
